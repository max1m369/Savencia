<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эмулятор рассылки Savencia — Варианты 1–8 и Варфрейм</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 12px;
      flex-wrap: wrap;
    }
    .variant-selector {
      display: flex;
      gap: 4px;
      background: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
      align-items: center;
    }
    .btn-var {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
    }
    .btn-var:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    .btn-var.active {
      background: #008fd0;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 143, 208, 0.45);
    }
    .btn-var.highlight.active {
      background: #de6a09;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(222, 106, 9, 0.5);
    }
    .controls {
      display: flex;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .btn-mode {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-mode:hover {
      color: #fff;
    }
    .btn-mode.active {
      background: #334155;
      color: #fff;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      overflow: auto;
      gap: 28px;
    }
    .device-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
    }
    .device-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .device-frame {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      overflow: hidden;
      border: 8px solid #334155;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .device-frame.mobile {
      width: 375px;
      height: 760px;
      border-radius: 38px;
      border: 12px solid #1e293b;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 0 2px #475569;
    }
    .device-frame.mobile::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 125px;
      height: 22px;
      background: #1e293b;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 10;
    }
    .device-frame.desktop {
      width: 740px;
      height: 760px;
      border-radius: 12px;
      border: 10px solid #1e293b;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    .size-indicator {
      font-size: 11px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .weight-indicator {
      font-size: 11px;
      color: #34d399;
      background: rgba(52, 211, 153, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <!-- Переключатель вариантов: Варфрейм и просто цифры 1..8 -->
    <div class="variant-selector">
      <button class="btn-var" onclick="setVariant('wireframe.html', this)">
        Варфрейм
      </button>
      <button class="btn-var" onclick="setVariant('variant1.html', this)">
        1
      </button>
      <button class="btn-var" onclick="setVariant('variant2.html', this)">
        2
      </button>
      <button class="btn-var" onclick="setVariant('variant3.html', this)">
        3
      </button>
      <button class="btn-var" onclick="setVariant('variant4.html', this)">
        4
      </button>
      <button class="btn-var" onclick="setVariant('variant5.html', this)">
        5
      </button>
      <button class="btn-var" onclick="setVariant('variant6.html', this)">
        6
      </button>
      <button class="btn-var" onclick="setVariant('variant7.html', this)">
        7
      </button>
      <button class="btn-var highlight active" onclick="setVariant('variant8.html', this)">
        8
      </button>
    </div>

    <!-- Режим экранов: Рядом, ПК, Смартфон -->
    <div class="controls">
      <button class="btn-mode active" onclick="setMode('side-by-side', this)">
        <span>📱💻</span> Рядом
      </button>
      <button class="btn-mode" onclick="setMode('desktop', this)">
        <span>💻</span> ПК
      </button>
      <button class="btn-mode" onclick="setMode('mobile', this)">
        <span>📱</span> Смартфон
      </button>
    </div>
  </header>

  <main id="mainContainer">
    <!-- Десктоп фрейм -->
    <div class="device-wrap" id="wrapDesktop">
      <div class="device-title">
        <span>💻 Компьютер / Outlook & Gmail Web</span>
        <span class="size-indicator">600–740px</span>
        <span class="weight-indicator" id="weightDesktop">HTML: 49.6 KB (&lt; 100 KB)</span>
      </div>
      <div class="device-frame desktop">
        <iframe id="iframeDesktop" src="variant8.html"></iframe>
      </div>
    </div>

    <!-- Мобильный фрейм -->
    <div class="device-wrap" id="wrapMobile">
      <div class="device-title">
        <span>📱 Смартфон (iOS / Android)</span>
        <span class="size-indicator">375px</span>
      </div>
      <div class="device-frame mobile">
        <iframe id="iframeMobile" src="variant8.html"></iframe>
      </div>
    </div>
  </main>

  <script>
    let currentVariant = 'variant8.html';

    function setVariant(url, btn) {
      document.querySelectorAll('.btn-var').forEach(b => {
        b.classList.remove('active');
        b.classList.remove('highlight');
      });
      btn.classList.add('active');
      btn.classList.add('highlight');
      currentVariant = url;
      document.getElementById('iframeDesktop').src = url;
      document.getElementById('iframeMobile').src = url;

      const weightEl = document.getElementById('weightDesktop');
      if (url === 'variant1.html') {
        weightEl.textContent = 'HTML: 40.4 KB (< 100 KB)';
      } else if (url === 'variant2.html') {
        weightEl.textContent = 'HTML: 50.2 KB (< 100 KB)';
      } else if (url === 'variant3.html') {
        weightEl.textContent = 'HTML: 51.7 KB (< 100 KB)';
      } else if (url === 'variant4.html') {
        weightEl.textContent = 'HTML: 39.4 KB (< 100 KB)';
      } else if (url === 'variant5.html') {
        weightEl.textContent = 'HTML: 54.4 KB (< 100 KB)';
      } else if (url === 'variant6.html') {
        weightEl.textContent = 'HTML: 69.5 KB (< 100 KB)';
      } else if (url === 'variant7.html') {
        weightEl.textContent = 'HTML: 54.3 KB (< 100 KB)';
      } else if (url === 'variant8.html') {
        weightEl.textContent = 'HTML: 49.6 KB (< 100 KB)';
      } else {
        weightEl.textContent = 'Ч/Б варфрейм';
      }
    }

    function setMode(mode, btn) {
      document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const wrapDesktop = document.getElementById('wrapDesktop');
      const wrapMobile = document.getElementById('wrapMobile');

      if (mode === 'side-by-side') {
        wrapDesktop.style.display = 'flex';
        wrapMobile.style.display = 'flex';
      } else if (mode === 'desktop') {
        wrapDesktop.style.display = 'flex';
        wrapMobile.style.display = 'none';
      } else if (mode === 'mobile') {
        wrapDesktop.style.display = 'none';
        wrapMobile.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
