<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 84" width="540" height="84">
  <defs>
    <!-- Glow filter for lights -->
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="bulb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Radial gradient for medallion background -->
    <radialGradient id="medallion-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a38" />
      <stop offset="80%" stop-color="#05151c" />
      <stop offset="100%" stop-color="#020b0f" />
    </radialGradient>
    <!-- Gold gradient for airplane and rings -->
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#f4b860" />
      <stop offset="100%" stop-color="#de6a09" />
    </linearGradient>
  </defs>

  <!-- LEFT GARLAND (Swag from x=18 to x=242) -->
  <g class="garland-left">
    <!-- Main stem shadow & branches -->
    <path d="M 18,28 Q 120,62 242,42" fill="none" stroke="#06231a" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 18,28 Q 120,62 242,42" fill="none" stroke="#0d3826" stroke-width="3" stroke-linecap="round"/>

    <!-- Pine branches and needle sprigs along the path -->
    <!-- Group 1: Near left edge -->
    <path d="M 25,30 L 14,22 M 25,30 L 10,32 M 25,30 L 18,40 M 35,33 L 28,21 M 35,33 L 24,44 M 45,36 L 40,23 M 45,36 L 38,48" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 25,30 L 17,25 M 35,33 L 29,26 M 45,36 L 38,42 M 55,40 L 50,27 M 55,40 L 48,52" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Group 2: Middle dip -->
    <path d="M 65,43 L 60,29 M 65,43 L 56,55 M 75,46 L 72,31 M 75,46 L 66,58 M 85,49 L 82,34 M 85,49 L 78,62 M 95,51 L 94,36 M 95,51 L 88,64" stroke="#166534" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 105,53 L 104,37 M 105,53 L 100,66 M 115,54 L 116,38 M 115,54 L 110,67 M 125,54 L 126,39 M 125,54 L 122,67 M 135,53 L 136,38 M 135,53 L 134,66" stroke="#15803d" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 105,53 L 110,43 M 115,54 L 122,44 M 125,54 L 120,62 M 135,53 L 142,45" stroke="#4ade80" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Group 3: Rising to medallion -->
    <path d="M 150,51 L 152,36 M 150,51 L 150,64 M 165,48 L 168,34 M 165,48 L 166,61 M 180,46 L 184,32 M 180,46 L 182,58 M 195,44 L 200,31 M 195,44 L 198,56" stroke="#166534" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 210,42 L 216,30 M 210,42 L 214,53 M 225,41 L 232,31 M 225,41 L 230,51 M 235,42 L 242,34 M 235,42 L 240,49" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 180,46 L 187,39 M 195,44 L 204,38 M 210,42 L 220,37 M 225,41 L 233,46" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Glowing Fairy Lights along left garland -->
    <path d="M 30,32 Q 50,45 70,44 Q 90,55 110,54 Q 135,60 160,50 Q 185,50 210,43 Q 225,45 240,42" fill="none" stroke="#78350f" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Light Bulbs with warm halos -->
    <circle cx="35" cy="38" r="4.5" fill="#fef08a" opacity="0.5" filter="url(#bulb-glow)"/>
    <circle cx="35" cy="38" r="2" fill="#fff" />
    <circle cx="60" cy="46" r="5" fill="#f59e0b" opacity="0.6" filter="url(#bulb-glow)"/>
    <circle cx="60" cy="46" r="2.2" fill="#fff" />
    <circle cx="85" cy="56" r="4.5" fill="#fef08a" opacity="0.5" filter="url(#bulb-glow)"/>
    <circle cx="85" cy="56" r="2" fill="#fff" />
    <circle cx="110" cy="61" r="5.5" fill="#de6a09" opacity="0.7" filter="url(#bulb-glow)"/>
    <circle cx="110" cy="61" r="2.3" fill="#fff" />
    <circle cx="135" cy="61" r="5.5" fill="#fde047" opacity="0.7" filter="url(#bulb-glow)"/>
    <circle cx="135" cy="61" r="2.5" fill="#fff" />
    <circle cx="160" cy="56" r="5" fill="#f59e0b" opacity="0.6" filter="url(#bulb-glow)"/>
    <circle cx="160" cy="56" r="2.2" fill="#fff" />
    <circle cx="185" cy="51" r="4.5" fill="#fef08a" opacity="0.5" filter="url(#bulb-glow)"/>
    <circle cx="185" cy="51" r="2" fill="#fff" />
    <circle cx="210" cy="47" r="5" fill="#de6a09" opacity="0.6" filter="url(#bulb-glow)"/>
    <circle cx="210" cy="47" r="2.2" fill="#fff" />
    <circle cx="232" cy="44" r="4" fill="#fef08a" opacity="0.5" filter="url(#bulb-glow)"/>
    <circle cx="232" cy="44" r="1.8" fill="#fff" />

    <!-- Golden stardust sparkles -->
    <path d="M 72,28 L 74,32 L 78,34 L 74,36 L 72,40 L 70,36 L 66,34 L 70,32 Z" fill="#fde047" opacity="0.8"/>
    <path d="M 148,27 L 149,30 L 152,31 L 149,32 L 148,35 L 147,32 L 144,31 L 147,30 Z" fill="#fde047" opacity="0.7"/>
  </g>

  <!-- RIGHT GARLAND (Swag from x=298 to x=522) -->
  <g class="garland-right">
    <!-- Main stem shadow & branches -->
    <path d="M 298,42 Q 420,62 522,28" fill="none" stroke="#06231a" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 298,42 Q 420,62 522,28" fill="none" stroke="#0d3826" stroke-width="3" stroke-linecap="round"/>

    <!-- Pine branches and clusters -->
    <path d="M 305,42 L 298,34 M 305,42 L 300,49 M 315,41 L 308,31 M 315,41 L 310,51 M 330,42 L 324,30 M 330,42 L 326,53 M 345,44 L 340,31 M 345,44 L 342,56" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 360,46 L 356,32 M 360,46 L 358,58 M 375,48 L 372,34 M 375,48 L 374,61 M 390,51 L 388,36 M 390,51 L 390,64 M 405,53 L 404,37 M 405,53 L 406,66" stroke="#166534" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 415,54 L 414,38 M 415,54 L 418,67 M 425,54 L 424,39 M 425,54 L 430,67 M 435,53 L 436,37 M 435,53 L 440,66 M 445,51 L 446,36 M 445,51 L 452,64" stroke="#15803d" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 415,54 L 418,44 M 425,54 L 432,62 M 435,53 L 428,45 M 445,51 L 452,43" stroke="#4ade80" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Group towards right edge -->
    <path d="M 455,49 L 458,34 M 455,49 L 462,62 M 465,46 L 468,31 M 465,46 L 474,58 M 475,43 L 480,29 M 475,43 L 484,55 M 485,40 L 490,27 M 485,40 L 492,52" stroke="#166534" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 495,36 L 500,23 M 495,36 L 502,48 M 505,33 L 512,21 M 505,33 L 516,44 M 515,30 L 526,22 M 515,30 L 530,32 M 515,30 L 522,40" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 475,43 L 470,37 M 485,40 L 480,33 M 495,36 L 490,28 M 505,33 L 501,42" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Glowing Fairy Lights along right garland -->
    <circle cx="308" cy="44" r="4" fill="#fef08a" opacity="0.5" filter="url(#bulb-glow)"/>
    <circle cx="308" cy="44" r="1.8" fill="#fff" />
    <circle cx="330" cy="47" r="5" fill="#f59e0b" opacity="0.6" filter="url(#bulb-glow)"/>
    <circle cx="330" cy="47" r="2.2" fill="#fff" />
    <circle cx="355" cy="51" r="4.5" fill="#fef08a" opacity="0.5" filter="url(#bulb-glow)"/>
    <circle cx="355" cy="51" r="2" fill="#fff" />
    <circle cx="380" cy="56" r="5" fill="#de6a09" opacity="0.6" filter="url(#bulb-glow)"/>
    <circle cx="380" cy="56" r="2.2" fill="#fff" />
    <circle cx="405" cy="61" r="5.5" fill="#fde047" opacity="0.7" filter="url(#bulb-glow)"/>
    <circle cx="405" cy="61" r="2.5" fill="#fff" />
    <circle cx="430" cy="61" r="5.5" fill="#f59e0b" opacity="0.7" filter="url(#bulb-glow)"/>
    <circle cx="430" cy="61" r="2.3" fill="#fff" />
    <circle cx="455" cy="56" r="4.5" fill="#fef08a" opacity="0.5" filter="url(#bulb-glow)"/>
    <circle cx="455" cy="56" r="2" fill="#fff" />
    <circle cx="480" cy="46" r="5" fill="#de6a09" opacity="0.6" filter="url(#bulb-glow)"/>
    <circle cx="480" cy="46" r="2.2" fill="#fff" />
    <circle cx="505" cy="38" r="4.5" fill="#fef08a" opacity="0.5" filter="url(#bulb-glow)"/>
    <circle cx="505" cy="38" r="2" fill="#fff" />

    <!-- Golden stardust sparkles -->
    <path d="M 392,27 L 393,30 L 396,31 L 393,32 L 392,35 L 391,32 L 388,31 L 391,30 Z" fill="#fde047" opacity="0.7"/>
    <path d="M 468,28 L 470,32 L 474,34 L 470,36 L 468,40 L 466,36 L 462,34 L 466,32 Z" fill="#fde047" opacity="0.8"/>
  </g>

  <!-- CENTRAL MEDALLION AT (270, 42) -->
  <g class="medallion" transform="translate(270, 42)">
    <!-- Outer ambient aura -->
    <circle cx="0" cy="0" r="35" fill="#f4b860" opacity="0.2" filter="url(#gold-glow)"/>
    <!-- Outer gold border & dark teal disc -->
    <circle cx="0" cy="0" r="30" fill="url(#medallion-grad)" stroke="url(#gold-metal)" stroke-width="2.5" filter="url(#gold-glow)"/>
    <!-- Inner dashed decorative ring -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#de6a09" stroke-width="1.2" stroke-dasharray="3, 2.5" opacity="0.9"/>

    <!-- AIRCRAFT VECTOR FLYING STRAIGHT UP (NORTH / CLIMBING) -->
    <g transform="translate(0, 0)">
      <!-- Aircraft shadow for depth -->
      <path d="M 0,-18 C 1.2,-15 2.2,-8 2.2,6 L 2.0,12 L 0.8,17 L -0.8,17 L -2.0,12 L -2.2,6 C -2.2,-8 -1.2,-15 0,-18 Z" fill="#020b0f" opacity="0.6"/>

      <!-- Swept Wings -->
      <path d="M 0,-3 L 19,7 L 19,9.5 L 2,6 L 0,-3 Z" fill="url(#gold-metal)"/>
      <path d="M 0,-3 L -19,7 L -19,9.5 L -2,6 L 0,-3 Z" fill="url(#gold-metal)"/>

      <!-- Wingtip winglets (pointing UP) -->
      <path d="M 19,7 L 19.5,4.5 L 18.2,7 Z" fill="#ffffff"/>
      <path d="M -19,7 L -19.5,4.5 L -18.2,7 Z" fill="#ffffff"/>

      <!-- Jet Engines under wings -->
      <rect x="5.5" y="3" width="2.5" height="6" rx="1.2" fill="#ffe082" stroke="#b45309" stroke-width="0.5"/>
      <rect x="-8.0" y="3" width="2.5" height="6" rx="1.2" fill="#ffe082" stroke="#b45309" stroke-width="0.5"/>

      <!-- Tail horizontal stabilizers -->
      <path d="M 0,11 L 8.5,16.5 L 8.5,18 L 1.5,16 L 0,11 Z" fill="url(#gold-metal)"/>
      <path d="M 0,11 L -8.5,16.5 L -8.5,18 L -1.5,16 L 0,11 Z" fill="url(#gold-metal)"/>

      <!-- Main fuselage silhouette -->
      <path d="M 0,-19 C 1.5,-15 2.4,-7 2.4,7 L 2.0,13.5 L 0,18.5 L -2.0,13.5 L -2.4,7 C -2.4,-7 -1.5,-15 0,-19 Z" fill="url(#gold-metal)"/>

      <!-- Cockpit windshield highlight -->
      <path d="M 0,-15.5 C 0.8,-13.5 1.1,-11.5 0,-10.5 C -1.1,-11.5 -0.8,-13.5 0,-15.5 Z" fill="#020b0f"/>

      <!-- Fuselage center spine reflection -->
      <line x1="0" y1="-12" x2="0" y2="14" stroke="#ffffff" stroke-width="0.8" opacity="0.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>