  <style>

  \u003ctd\n                   align=\"left\" style=\"font-size:0px;padding:0 0 24px;word-break:break-word;\"\n                \u003e\n                  \n      \u003cdiv\n         style=\"font-family:Arial, Helvetica, sans-serif;font-size:17px;line-height:1.65;text-align:left;color:#173f4c;\"\n      \u003e10 декабря мы отправляемся в праздничное путешествие, которое объединит сотрудников Savencia из трёх городов — Москвы, Уфы и Белебея.\u003c/div\u003e\n    \n                \u003c/td\u003e\n              \u003c/tr\u003e\n            \n        \u003c/tbody\u003e\n      \u003c/table\u003e\n    \n      \u003c/div\u003e\n    \n          \u003c!--[if mso | IE]\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c![endif]--\u003e\n              \u003c/td\u003e\n            \u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n        \n      \u003c/div\u003e\n    \n      \n      \u003c!--[if mso | IE]\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003ctable align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"\" role=\"presentation\" style=\"width:640px;\" width=\"640\" bgcolor=\"#004b62\" \u003e\u003ctr\u003e\u003ctd style=\"line-height:0px;font-size:0px;mso-line-height-rule:exactly;\"\u003e\u003c![endif]--\u003e\n    \n      \n      \u003cdiv  style=\"background:#004b62;background-color:#004b62;margin:0px auto;max-width:640px;\"\u003e\n        \n        \u003ctable\n           align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"background:#004b62;background-color:#004b62;width:100%;\"\n        \u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\n              \u003ctd\n                 style=\"direction:ltr;font-size:0px;padding:23px 28px;text-align:center;\"\n              \u003e\n                \u003c!--[if mso | IE]\u003e\u003ctable role=\"presentation\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\"\u003e\u003ctr\u003e\u003ctd class=\"\" style=\"verti ss=\"\" style=\"vertical-align:top;width:584px;\" \u003e\u003c![endif]--\u003e\n            \n      \u003cdiv\n         class=\"mj-column-per-100 mj-outlook-group-fix\" style=\"font-size:0px;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%;\"\n      \u003e\n        \n      \u003ctable\n         border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"vertical-align:top;\" width=\"100%\"\n      \u003e\n        \u003ctbody\u003e\n          \n              \u003ctr\u003e\n                \u003ctd\n                   align=\"left\" style=\"font-size:0px;padding:0 0 14px;word-break:break-word;\"\n                \u003e\n                  \n      \u003cdiv\n         style=\"font-family:Arial, Helvetica, sans-serif;font-size:25px;font-weight:700;line-height:1.3;text-align:left;color:#ffffff;\"\n      \u003eДо встречи 10 декабря!\u003c/div\u003e\n    \n                \u003c/td\u003e\n              \u003c/tr\u003e\n            \n              \u003ctr\u003e\n                \u003ctd\n                   align=\"left\" style=\"font-size:0px;padding:0;word-break:break-word;\"\n                \u003e\n                  \n      \u003cdiv\n         style=\"font-family:Arial, Helvetica, sans-serif;font-size:17px;line-height:1.65;text-align:left;color:#ffffff;\"\n      \u003eВаш экипаж Savencia ✈️\u003c/div\u003e\n    \n                \u003c/td\u003e\n              \u003c/tr\u003e\n            \n        \u003c/tbody\u003e\n      \u003c/table\u003e\n    \n      \u003c/div\u003e\n    \n          \u003c!--[if mso | IE]\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c![endif]--\u003e\n              \u003c/td\u003e\n            \u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n        \n      \u003c/div\u003e\n    \n      \n      \u003c!--[if mso | IE]\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c![endif]--\u003e\n    \n    \n      \u003c/div\u003e\n      \u003c/body\u003e\n    \n\u003c/html\u003e"}];
    const frame = document.getElementById("frame");
    const buttons = document.getElementById("variants");
    const desktop = document.getElementById("desktop");
    const mobile = document.getElementById("mobile");
    let current = 0;

    function resizeFrame() {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.body) return;

        frame.style.height = "1px";

        const height = Math.max(
          doc.body.scrollHeight,
          doc.documentElement.scrollHeight,
          doc.body.offsetHeight
        );

        frame.style.height = (height + 24) + "px";
      } catch {
        frame.style.height = "4000px";
      }
    }

    function select(index) {
      current = index;
      const item = variants[index];

      document.getElementById("name").textContent = item.name;
      document.getElementById("size").textContent =
        "HTML: " + (item.bytes / 1024).toFixed(1) + " КиБ";

      document.getElementById("mjmlLink").href =
        item.key + ".mjml";

      document.getElementById("htmlLink").href =
        item.key + ".html";

      buttons.querySelectorAll("button").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });

      frame.title = item.name;
      frame.style.height = "3200px";
      frame.srcdoc = item.html;
    }

    variants.forEach((item, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = item.name;
      button.addEventListener("click", () => select(index));
      buttons.appendChild(button);
    });

    function setMobile(enabled) {
      document.body.classList.toggle("mobile", enabled);
      desktop.classList.toggle("active", !enabled);
      mobile.classList.toggle("active", enabled);
      setTimeout(resizeFrame, 150);
      setTimeout(resizeFrame, 500);
    }

    desktop.addEventListener("click", () => setMobile(false));
    mobile.addEventListener("click", () => setMobile(true));

    frame.addEventListener("load", () => {
      resizeFrame();
      setTimeout(resizeFrame, 300);
      setTimeout(resizeFrame, 900);

      try {
        frame.contentDocument.querySelectorAll("img").forEach(img => {
          if (!img.complete) {
            img.addEventListener("load", resizeFrame, { once:true });
            img.addEventListener("error", resizeFrame, { once:true });
          }
        });
      } catch {}
    });

    window.addEventListener("resize", () => {
      setTimeout(resizeFrame, 100);
    });

    if (window.innerWidth < 500) {
      setMobile(true);
    }

    select(0);
  </script>
