<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Savencia — праздничная авиационная афиша</title>

  <style>
    * { box-sizing:border-box; }

    body {
      margin:0;
      background:#e1e8e8;
      color:#173f4c;
      font-family:Arial,Helvetica,sans-serif;
    }

    header {
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      padding:15px 20px;
      background:#ffffff;
      border-bottom:1px solid #c4d8df;
    }

    h1 {
      margin:0 auto 0 0;
      font-size:18px;
    }

    button {
      padding:10px 13px;
      border:1px solid #9bb9c4;
      color:#004b62;
      background:#ffffff;
      font:inherit;
      font-size:13px;
      cursor:pointer;
    }

    button.active {
      background:#004b62;
      color:#ffffff;
    }

    .info {
      max-width:700px;
      margin:18px auto;
      padding:0 16px;
      font-size:13px;
      line-height:1.6;
    }

    a {
      color:#004b62;
      margin-left:12px;
    }

    .stage {
      overflow-x:auto;
      padding:0 12px 40px;
    }

    iframe {
      display:block;
      width:640px;
      height:3500px;
      margin:auto;
      border:0;
      background:#ffffff;
      box-shadow:0 12px 36px rgba(0,45,65,.12);
    }

    body.mobile iframe {
      width:375px;
    }

    body.narrow iframe {
      width:320px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Праздничная авиационная афиша</h1>
    <button id="desktop" class="active" type="button">
      Компьютер · 640 px
    </button>
    <button id="mobile" type="button">
      Телефон · 375 px
    </button>
    <button id="narrow" type="button">
      Узкий экран · 320 px
    </button>
  </header>

    HTML: 83.4 КиБ.

    <a href="g.mjml">MJML</a>

  </div>

  <div class="stage">
    <iframe id="frame" title="Письмо Savencia"></iframe>
  </div>

  <script>
    const frame = document.getElementById("frame");
    const modes = ["desktop", "mobile", "narrow"];

    function resizeFrame() {
      try {
        const doc = frame.contentDocument;

        if (!doc || !doc.body) return;

        frame.style.height = "1px";

        const height = Math.max(
          doc.body.scrollHeight,
          doc.documentElement.scrollHeight,
          doc.body.offsetHeight
        );

        frame.style.height = (height + 24) + "px";
      } catch {
        frame.style.height = "5000px";
      }
    }

    function setMode(mode) {
      document.body.classList.toggle(
        "mobile", mode === "mobile"
      );

      document.body.classList.toggle(
        "narrow", mode === "narrow"
      );

      modes.forEach(name => {
        document.getElementById(name).classList.toggle(
          "active", name === mode
        );
      });

      setTimeout(resizeFrame, 100);
      setTimeout(resizeFrame, 500);
    }

    modes.forEach(mode => {
      document.getElementById(mode).addEventListener(
        "click", () => setMode(mode)
      );
    });

    frame.addEventListener("load", () => {
      resizeFrame();
      setTimeout(resizeFrame, 300);
      setTimeout(resizeFrame, 900);

      try {
        frame.contentDocument.querySelectorAll("img").forEach(img => {
          if (!img.complete) {
            img.addEventListener(
              "load", resizeFrame, { once:true }
            );
            img.addEventListener(
              "error", resizeFrame, { once:true }
            );
          }
        });
      } catch {}
    });

    window.addEventListener("resize", () => {
      setTimeout(resizeFrame, 100);
    });

    if (window.innerWidth < 500) {
      setMode("mobile");
    }
