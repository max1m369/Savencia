<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Эмулятор рассылки Savencia — Варианты 1–7 и Варфрейм</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b131e;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Верхняя панель переключения */
    header {
      background-color: #0f1c2d;
      border-bottom: 1px solid #1e293b;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .variant-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .btn-var {
      background-color: #1a2736;
      border: 1px solid #2d3f54;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      line-height: 1;
    }

    .btn-var:hover {
      background-color: #243547;
      color: #ffffff;
      border-color: #3b82f6;
    }

    .btn-var.active {
      background-color: #004b62;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .btn-var.highlight.active {
      background-color: #de6a09;
      border-color: #f97316;
      box-shadow: 0 0 10px rgba(222, 106, 9, 0.4);
    }

    /* Правые переключатели режимов */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-mode {
      background-color: #1a2736;
      border: 1px solid #2d3f54;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-mode:hover {
      background-color: #243547;
      color: #ffffff;
    }

    .btn-mode.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #60a5fa;
    }

    /* Основная рабочая область */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
      padding: 24px 20px;
      overflow-x: auto;
    }

    /* Оболочки устройств */
    .device-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .device-title {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-indicator {
      background-color: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
    }

    .weight-indicator {
      background-color: #064e3b;
      color: #34d399;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }

    /* Рамка для ПК */
    .device-frame.desktop {
      width: 720px;
      height: 840px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .device-frame.desktop iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }

    /* Рамка для смартфона (iPhone-стиль) */
    .device-frame.mobile {
      width: 375px;
      height: 780px;
      background: #000000;
      border-radius: 44px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 8px #1f2937, 0 0 0 9px #374151;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Островок/Динамик iPhone */
    .device-frame.mobile::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 24px;
      background-color: #1f2937;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 10;
    }

    .device-frame.mobile iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
      padding-top: 10px;
      box-sizing: border-box;
    }

    @media (max-width: 1180px) {
      main {
        flex-direction: column;
        align-items: center;
      }
      .device-frame.desktop {
        width: 100%;
        max-width: 680px;
      }
    }
  </style>
</head>
<body>

  <header>
    <!-- Переключатель вариантов: Варфрейм и просто цифры 1..7 -->
    <div class="variant-selector">
      <button class="btn-var" onclick="setVariant('wireframe.html', this)">
        Варфрейм
      </button>
      <button class="btn-var highlight active" onclick="setVariant('variant1.html', this)">
        1
      </button>
      <button class="btn-var" onclick="setVariant('variant2.html', this)">
        2
      </button>
      <button class="btn-var" onclick="setVariant('variant3.html', this)">
        3
      </button>
      <button class="btn-var" onclick="setVariant('variant4.html', this)">
        4
      </button>
      <button class="btn-var" onclick="setVariant('variant5.html', this)">
        5
      </button>
      <button class="btn-var" onclick="setVariant('variant6.html', this)">
        6
      </button>
      <button class="btn-var" onclick="setVariant('variant7.html', this)">
        7
      </button>
    </div>

    <!-- Режим экранов: Рядом, ПК, Смартфон -->
    <div class="controls">
      <button class="btn-mode active" onclick="setMode('side-by-side', this)">
        <span>📱💻</span> Рядом
      </button>
      <button class="btn-mode" onclick="setMode('desktop', this)">
        <span>💻</span> ПК
      </button>
      <button class="btn-mode" onclick="setMode('mobile', this)">
        <span>📱</span> Смартфон
      </button>
    </div>
  </header>

  <main id="mainContainer">
    <!-- Десктоп фрейм -->
    <div class="device-wrap" id="wrapDesktop">
      <div class="device-title">
        <span>💻 Компьютер / Outlook & Gmail Web</span>
        <span class="size-indicator">600–740px</span>
        <span class="weight-indicator" id="weightDesktop">HTML: 38.7 KB (&lt; 100 KB)</span>
      </div>
      <div class="device-frame desktop">
        <iframe id="iframeDesktop" src="variant1.html"></iframe>
      </div>
    </div>

    <!-- Мобильный фрейм -->
    <div class="device-wrap" id="wrapMobile">
      <div class="device-title">
        <span>📱 Смартфон (iOS / Android)</span>
        <span class="size-indicator">375px</span>
      </div>
      <div class="device-frame mobile">
        <iframe id="iframeMobile" src="variant1.html"></iframe>
      </div>
    </div>
  </main>

  <script>
    let currentVariant = 'variant1.html';

    function setVariant(url, btn) {
      document.querySelectorAll('.btn-var').forEach(b => {
        b.classList.remove('active');
        b.classList.remove('highlight');
      });
      btn.classList.add('active');
      btn.classList.add('highlight');
      currentVariant = url;
      document.getElementById('iframeDesktop').src = url;
      document.getElementById('iframeMobile').src = url;

      const weightEl = document.getElementById('weightDesktop');
      if (url === 'variant1.html') {
        weightEl.textContent = 'HTML: 38.7 KB (< 100 KB)';
      } else if (url === 'variant2.html') {
        weightEl.textContent = 'HTML: 46.6 KB (< 100 KB)';
      } else if (url === 'variant3.html') {
        weightEl.textContent = 'HTML: 30.4 KB (< 100 KB)';
      } else if (url === 'variant4.html') {
        weightEl.textContent = 'HTML: 73.7 KB (< 100 KB)';
      } else if (url === 'variant5.html') {
        weightEl.textContent = 'HTML: 31.1 KB (< 100 KB)';
      } else if (url === 'variant6.html') {
        weightEl.textContent = 'HTML: 39.8 KB (< 100 KB)';
      } else if (url === 'variant7.html') {
        weightEl.textContent = 'HTML: 48.5 KB (< 100 KB)';
      } else {
        weightEl.textContent = 'Ч/Б варфрейм';
      }
    }

    function setMode(mode, btn) {
      document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const wrapDesktop = document.getElementById('wrapDesktop');
      const wrapMobile = document.getElementById('wrapMobile');

      if (mode === 'side-by-side') {
        wrapDesktop.style.display = 'flex';
        wrapMobile.style.display = 'flex';
      } else if (mode === 'desktop') {
        wrapDesktop.style.display = 'flex';
        wrapMobile.style.display = 'none';
      } else if (mode === 'mobile') {
        wrapDesktop.style.display = 'none';
        wrapMobile.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
